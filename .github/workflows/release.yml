name: Release

permissions:
    contents: write
    id-token: write
    attestations: write

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
            - "v[0-9]+.[0-9]+.[0-9]+-*"

    # The dry run: a manual dispatch builds, packages and smoke-tests every artefact exactly as
    # a tag would, then stops before the one irreversible step. A packaging change is proven
    # end to end before a tag exists, and no throwaway tag is ever cut to find out.
    workflow_dispatch:

jobs:
    validate:
        name: Validate Release
        runs-on: ubuntu-latest
        timeout-minutes: 5

        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
            is-release: ${{ steps.version.outputs.is-release }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Determine version
              id: version
              shell: bash
              run: |
                if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
                    # A rehearsal: the version file's own number, marked so no artefact of a dry
                    # run can be mistaken for a release, and nothing is published.
                    VERSION="$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')-dryrun"
                    echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "is-release=false" >> "$GITHUB_OUTPUT"
                    echo "Dry run: building as ${VERSION}, publishing nothing."
                    exit 0
                fi

                TAG="${GITHUB_REF#refs/tags/}"

                # Validate tag format
                if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
                    echo "Error: Invalid tag format: $TAG"
                    echo "Expected format: v0.0.0 or v0.0.0-suffix"
                    exit 1
                fi

                VERSION="${TAG#v}"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "is-release=true" >> "$GITHUB_OUTPUT"
                echo "Release version: $VERSION (tag: $TAG)"

            # Three gates that fail in seconds rather than after a thirty-minute matrix. A tag can be
            # pushed from any commit: one that never reached main, one that sat between a red CI run
            # and its fix. Only a commit on main - one every gate has passed - may be released.
            - name: The tagged commit is on main
              if: steps.version.outputs.is-release == 'true'
              shell: bash
              run: |
                git fetch --no-tags --depth=200 origin main
                if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
                    echo "::error::The tagged commit ${GITHUB_SHA} is not on main. Release from main, or merge first."
                    exit 1
                fi
                echo "The tagged commit is on main."

            # The release notes are the CHANGELOG entry, so a version without one is a release
            # with no words: refused on a tag, a warning on a rehearsal.
            - name: CHANGELOG.md has an entry for this version
              shell: bash
              run: |
                VERSION="${{ steps.version.outputs.version }}"
                BASE="${VERSION%-dryrun}"
                if grep -q "^## \[${BASE}\]" CHANGELOG.md; then
                    echo "CHANGELOG.md carries ## [${BASE}]."
                elif [[ "${{ steps.version.outputs.is-release }}" == "true" ]]; then
                    echo "::error::CHANGELOG.md has no ## [${BASE}] section. Move the Unreleased entries under the version before tagging."
                    exit 1
                else
                    echo "::warning::CHANGELOG.md has no ## [${BASE}] section yet; a real release would refuse here."
                fi

            - name: No release exists for this tag yet
              if: steps.version.outputs.is-release == 'true'
              shell: bash
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
                    echo "::error::A release for ${{ steps.version.outputs.tag }} already exists. Delete it deliberately, or tag the next version."
                    exit 1
                fi
                echo "No release for ${{ steps.version.outputs.tag }} yet."

            - name: Verify Cargo.toml version matches tag
              shell: bash
              run: |
                CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
                TAG_VERSION="${{ steps.version.outputs.version }}"

                # For pre-release tags like v0.1.0-rc1, compare base version
                BASE_TAG_VERSION="${TAG_VERSION%%-*}"

                if [[ "$CARGO_VERSION" != "$BASE_TAG_VERSION" ]]; then
                    echo "Error: Version mismatch!"
                    echo "  Cargo.toml: $CARGO_VERSION"
                    echo "  Tag:        $BASE_TAG_VERSION"
                    echo ""
                    echo "Update Cargo.toml version before tagging."
                    exit 1
                fi

                echo "Version verified: $CARGO_VERSION"

    build:
        name: Build (${{ matrix.os }})
        needs: validate
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      artifact: link-windows-x86_64
                      archive: zip

                    - os: ubuntu-latest
                      artifact: link-linux-x86_64
                      archive: tar.gz

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The runners ship a Rust toolchain, but an image refresh can lag a release; updating
            # to current stable makes the toolchain a fact of this run rather than of the image.
            - name: Update the stable toolchain
              run: |
                rustup update --no-self-update stable
                rustup default stable
                cargo --version
                rustc --version

            # The release builds through the CMake face too - the same two files any consumer
            # uses - so what ships is what the face produces, not a parallel path.
            - name: Build release binary through the CMake face
              run: cmake --workflow --preset default

            # A tag can be pushed from any commit, including one that never reached main or that
            # sat between a red CI run and its fix. Without this the workflow would happily build,
            # sign, attest and publish a library whose tests fail - and the attestation would then
            # vouch for the provenance of an untested artefact.
            - name: Test release build
              run: cargo test --release

            - name: Check the Link protocol version was bumped
              run: python3 tools/check_protocol_version.py check

            # The artefact is the loaded contract: the shared library both ends load, the C
            # header consumers compile against, and the fingerprint that ties the two together.
            - name: Prepare artifact (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                mkdir -p dist/include/lnk
                cp target/release/liblink.so dist/
                cp include/lnk/lnk_protocol.h include/lnk/lnk_client.h include/lnk/protocol_fingerprint.txt dist/include/lnk/
                cp README.md LICENCE CHANGELOG.md dist/
                cd dist
                tar -czvf ../${{ matrix.artifact }}.tar.gz *

            - name: Prepare artifact (Windows)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                mkdir -p dist/include/lnk
                cp target/release/link.dll target/release/link.dll.lib dist/
                cp include/lnk/lnk_protocol.h include/lnk/lnk_client.h include/lnk/protocol_fingerprint.txt dist/include/lnk/
                cp README.md LICENCE CHANGELOG.md dist/
                cd dist
                7z a -tzip ../${{ matrix.artifact }}.zip *

            # The artefact as a consumer will meet it: unpacked into a clean directory, every file
            # the contract needs present by name - the library, both headers, the fingerprint -
            # and the fingerprint the archive carries the one this build recorded.
            - name: Unpack and check the packaged artefact (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                rm -rf smoke && mkdir smoke && tar -xzf ${{ matrix.artifact }}.tar.gz -C smoke
                cd smoke
                for required in liblink.so include/lnk/lnk_protocol.h include/lnk/lnk_client.h include/lnk/protocol_fingerprint.txt README.md LICENCE CHANGELOG.md; do
                    [[ -e "$required" ]] || { echo "::error::The artefact is missing $required"; find . -type f; exit 1; }
                done
                cmp include/lnk/protocol_fingerprint.txt ../include/lnk/protocol_fingerprint.txt
                nm -D --defined-only liblink.so | grep -q lnkGetClientVTable || { echo "::error::The library does not export lnkGetClientVTable"; exit 1; }

            - name: Unpack and check the packaged artefact (Windows)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                rm -rf smoke && mkdir smoke && 7z x -osmoke ${{ matrix.artifact }}.zip >/dev/null
                cd smoke
                for required in link.dll link.dll.lib include/lnk/lnk_protocol.h include/lnk/lnk_client.h include/lnk/protocol_fingerprint.txt README.md LICENCE CHANGELOG.md; do
                    [[ -e "$required" ]] || { echo "::error::The artefact is missing $required"; find . -type f; exit 1; }
                done
                cmp include/lnk/protocol_fingerprint.txt ../include/lnk/protocol_fingerprint.txt

            - name: Upload artifact (Unix)
              if: runner.os != 'Windows'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: ${{ matrix.artifact }}
                path: ${{ matrix.artifact }}.tar.gz
                retention-days: 1

            - name: Upload artifact (Windows)
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: ${{ matrix.artifact }}
                path: ${{ matrix.artifact }}.zip
                retention-days: 1

    release:
        name: Create Release
        needs: [validate, build]
        # A dry run stops here: everything above ran as it would for a tag, and nothing below
        # is done - the one step that cannot be taken back is the one a rehearsal skips.
        if: needs.validate.outputs.is-release == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download all artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                path: artifacts

            - name: List artifacts
              run: find artifacts -type f

            # Every platform delivered, or nothing is published: a matrix leg that quietly failed
            # to upload would otherwise become a release with a platform missing.
            - name: Every artefact arrived
              shell: bash
              run: |
                expected="link-windows-x86_64 link-linux-x86_64"
                for name in $expected; do
                    ls artifacts/*/"$name".* >/dev/null 2>&1 || { echo "::error::No artefact named $name arrived"; find artifacts -type f; exit 1; }
                done
                echo "All artefacts present: $expected"

            - name: Generate checksums
              shell: bash
              run: |
                cd artifacts
                find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
                sha256sum *.tar.gz *.zip > SHA256SUMS.txt
                cat SHA256SUMS.txt
                # Read back what was just written: the file a downloader will check against.
                sha256sum --check --strict SHA256SUMS.txt

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                subject-path: |
                    artifacts/*.tar.gz
                    artifacts/*.zip

            - name: Extract release notes from CHANGELOG
              id: release-notes
              shell: bash
              run: |
                VERSION="${{ needs.validate.outputs.version }}"

                # Extract release notes for this version from CHANGELOG.md
                # Uses awk with index() for literal string matching (avoids regex escaping issues)
                awk -v ver="## [${VERSION}]" '
                    index($0, ver) == 1 { found=1; next }
                    found && /^## \[/ { exit }
                    found { print }
                ' CHANGELOG.md > release_notes.md

                # Trim leading/trailing blank lines
                sed -i '/./,$!d' release_notes.md
                sed -i ':a;/^[[:space:]]*$/{$d;N;ba}' release_notes.md

                if [[ -s release_notes.md ]]; then
                    echo "Found release notes in CHANGELOG.md:"
                else
                    echo "No CHANGELOG entry for ${VERSION}, using default"
                    echo "Release ${VERSION}" > release_notes.md
                fi

                echo "--- Release Notes ---"
                cat release_notes.md

            - name: Create GitHub Release
              shell: bash
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                TAG="${{ needs.validate.outputs.tag }}"
                VERSION="${{ needs.validate.outputs.version }}"

                # Determine if this is a prerelease
                PRERELEASE_FLAG=""
                LATEST_FLAG="--latest"
                if [[ "$VERSION" == *-* ]]; then
                    PRERELEASE_FLAG="--prerelease"
                    LATEST_FLAG=""
                fi

                # Create the release with gh CLI (more reliable than third-party actions) - as a
                # draft. Publishing is the one irreversible step, and it stays a person's: the
                # artefacts, the checksums and the attestation can all be looked at first.
                gh release create "$TAG" \
                    --draft \
                    --title "$TAG" \
                    --notes-file release_notes.md \
                    $LATEST_FLAG \
                    $PRERELEASE_FLAG \
                    artifacts/*.tar.gz \
                    artifacts/*.zip \
                    artifacts/SHA256SUMS.txt
