name: CI - Main Branch

permissions:
    contents: read

# Runs are queued rather than cancelled here: unlike a pull request, every commit that lands on main
# should keep a result of its own.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        branches: [main]

    workflow_dispatch:

jobs:
    quick-checks:
        name: Quick Checks (markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "lts/*"

            - name: Restore npm cache
              id: npm-cache-restore
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-lock-${{ hashFiles('package-lock.json') }}

            # The linter is pinned by package-lock.json - the same bytes on every run and on every
            # desk - so a lint run is reproducible and a linter bump is a reviewable change rather
            # than a surprise red build. Dependabot proposes those bumps.
            - name: Install the pinned markdownlint-cli2
              run: npm ci --ignore-scripts

            - name: Lint markdown
              run: npx markdownlint-cli2 "**/*.md"

            # A carriage return sitting inside a line is invisible in every editor, survives
            # rustfmt and markdownlint, and reads as ordinary text in review. Three reached the
            # flagship's main before this step existed there, each one a Doxygen \return written
            # through a tool chain that collapsed the escape, leaving a control character and a
            # word reading "eturn" where the tag should be.
            #
            # .gitattributes normalises to LF and this runner is Linux, so the checkout contains
            # no legitimate carriage return at all and any match is a stray. -I skips binary
            # files, and taking the file list from git keeps build outputs and untracked scratch
            # out of it.
            - name: Check for stray carriage returns
              run: |
                if git ls-files -z | xargs -0 grep -lIP '\r'; then
                    echo "::error::The files above contain a carriage return. Line endings here are LF, so it is a stray one inside a line - look for a text written through a tool that ate an escape."
                    exit 1
                fi

            # lychee is installed from its pinned release archive with a checksum check rather
            # than through lycheeverse/lychee-action: the organisation runs GitHub-owned actions
            # only, and a verified download keeps that policy - and the trust it means - intact.
            - name: Install lychee
              shell: bash
              env:
                LYCHEE_VERSION: v0.24.2
                LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
              run: |
                curl -sSfL -o lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
                echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum --check --strict
                tar -xzf lychee.tar.gz
                sudo install -m 755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
                rm -rf lychee.tar.gz lychee-x86_64-unknown-linux-gnu
                lychee --version

            # Every internal link and anchor in the documentation resolves - offline, so the
            # answer is deterministic and a third-party site cannot redden a pull request. The
            # external links have their own scheduled workflow.
            - name: Check internal links and anchors
              run: lychee --offline --include-fragments --no-progress --root-dir "$(pwd)" --exclude-path target --exclude-path build --exclude-path node_modules "./**/*.md"

            # rust-toolchain.toml is the one place a compiler version lives. The day a workflow
            # installs a toolchain of its own, CI has a second source of truth and the pin's
            # guarantee is gone silently - everything still builds. Adopted from the owner's
            # setonix-os.
            - name: The toolchain is pinned in one place
              run: bash .github/scripts/check-toolchain-pin.sh

            # LNK_PROTOCOL_VERSION stops two ends of the wire shaking hands on a number while
            # disagreeing about the bytes, and nothing enforces it by itself. So the header is
            # fingerprinted with the version line removed, and a changed fingerprint at an
            # unchanged version is refused here rather than in a reviewer's memory - the same
            # mechanism, and the same fingerprint, the handshake itself carries.
            - name: Check the Link protocol version was bumped
              run: python3 tools/check_protocol_version.py check

            - name: Save npm cache
              if: steps.npm-cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-lock-${{ hashFiles('package-lock.json') }}

    build:
        name: Build (${{ matrix.os }})
        needs: quick-checks
        timeout-minutes: 15

        strategy:
            fail-fast: false

            matrix:
                os: [ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The runners ship a Rust toolchain, but the build is pinned to one exact version in
            # rust-toolchain.toml, locally and here alike, so a new rustc or clippy never turns a
            # green build red on its own timetable.
            - name: Install the pinned toolchain
              run: |
                # rust-toolchain.toml pins the exact version; rustup installs it on first use.
                rustup show active-toolchain
                cargo --version
                rustc --version

            # Main saves the build directory the pull requests restore, keyed by the toolchain
            # and the manifest.
            - name: Restore and save the cargo cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: |
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    target/
                key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}

            - name: Formatting must be canonical
              run: cargo fmt --check

            # The doc comments are half of what these crates are; a broken intra-doc link or a
            # missing code-block language is a lie waiting for a reader.
            - name: Documentation builds without a warning
              env:
                RUSTDOCFLAGS: -D warnings
              run: cargo doc --locked --no-deps --document-private-items

            - name: Clippy, warnings as errors
              run: cargo clippy --locked --all-targets -- --deny warnings

            # The build goes through the CMake face - the same two files any consumer uses -
            # so the face cannot rot: it is the pipeline, on both platforms, not a side check.
            # LANGUAGES NONE means no compiler is probed and no VS environment is needed; the
            # library lands in target/release exactly as a direct cargo build would put it.
            - name: Build through the CMake face
              run: cmake --workflow --preset default

            - name: Test
              run: cargo test --locked

    # The flagship also runs sanitiser jobs and a software-Vulkan verification job. Neither
    # transfers: nothing here needs a device, and Rust's sanitisers require the nightly
    # toolchain, which this repository does not use.
    ci-success:
        name: CI Success
        needs: [quick-checks, build]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] || \
                   [[ "${{ needs.build.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
